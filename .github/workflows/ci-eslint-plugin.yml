name: CI ESLint Plugin

on:
  pull_request:
    paths:
      - 'eslint-plugin/**'
      - '.github/workflows/ci-eslint-plugin.yml'
  push:
    branches: [main]
    paths:
      - 'eslint-plugin/**'
      - '.github/workflows/ci-eslint-plugin.yml'

concurrency:
  group: ci-eslint-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          cache-dependency-path: eslint-plugin/package-lock.json
          node-version: '24'

      - name: Use known-good npm
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        working-directory: eslint-plugin
        run: npm ci

      - name: Verify package
        working-directory: eslint-plugin
        run: npm run verify
