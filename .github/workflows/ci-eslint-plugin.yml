name: CI ESLint Plugin

on:
  pull_request:
    paths:
      - 'eslint-plugin/**'
      - '.github/workflows/ci-eslint-plugin.yml'
  push:
    branches: [main]
    paths:
      - 'eslint-plugin/**'
      - '.github/workflows/ci-eslint-plugin.yml'

concurrency:
  group: ci-eslint-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          cache-dependency-path: eslint-plugin/package-lock.json
          node-version: '24'

      - name: Use known-good npm
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        working-directory: eslint-plugin
        run: npm ci

      - name: Verify package
        working-directory: eslint-plugin
        run: npm run verify
